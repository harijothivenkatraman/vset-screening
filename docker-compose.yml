services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vset
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vset
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vset -d vset"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://vset:${POSTGRES_PASSWORD}@db:5432/vset
      ENVIRONMENT: ${ENVIRONMENT:-production}
      IMPORT_API_KEY: ${IMPORT_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-true}
      SEARCH_PROVIDERS: ${SEARCH_PROVIDERS:-["searxng","duckduckgo"]}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-300}
      LLM_PROFILE: ${LLM_PROFILE:-light}
      CACHE_TTL: ${CACHE_TTL:-3600}
      SCRAPER_MIN_INTERVAL: ${SCRAPER_MIN_INTERVAL:-3.0}
      IMAGE_PROXY_ALLOWED_HOSTS: ${IMAGE_PROXY_ALLOWED_HOSTS:-["media.licdn.com","static.licdn.com"]}
      DISCOVERY_MAX_JOBS_STORED: ${DISCOVERY_MAX_JOBS_STORED:-20}
      DISCOVERY_MAX_EVIDENCE_SIZE_MB: ${DISCOVERY_MAX_EVIDENCE_SIZE_MB:-5}
      DISCOVERY_RATE_LIMIT_PER_HOUR: ${DISCOVERY_RATE_LIMIT_PER_HOUR:-5}
      DISCOVERY_MIN_FREE_DISK_GB: ${DISCOVERY_MIN_FREE_DISK_GB:-2.0}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').getcode() == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_API_KEY: ${IMPORT_API_KEY}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-http://localhost}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
  caddy_data:
  caddy_config:
