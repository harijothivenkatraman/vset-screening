<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LinkedIn: Log In or Sign Up</title>
    <meta name="robots" content="noarchive, noindex">
</head>
<body>
    <div class="auth-wall-container">
        <h1>Sign in to LinkedIn</h1>
        <p>Join LinkedIn to see full profiles, connect with colleagues, and discover opportunities.</p>
        <form action="/uas/login-submit" method="post">
            <input type="text" name="session_key" placeholder="Email or phone" />
            <input type="password" name="session_password" placeholder="Password" />
            <button type="submit">Sign in</button>
        </form>
    </div>
</body>
</html>
