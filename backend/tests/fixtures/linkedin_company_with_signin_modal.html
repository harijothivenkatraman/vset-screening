<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mysa: Overview | LinkedIn</title>
    <meta property="og:title" content="Mysa | LinkedIn">
    <meta property="og:description" content="Mysa provides AI-powered accounts payable and finance automation.">
    <meta property="og:image" content="https://media.licdn.com/dms/image/mysa_logo.png">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Mysa",
        "description": "AI-powered accounts payable and finance automation.",
        "url": "https://mysa.io",
        "knowsAbout": ["Fintech", "Artificial Intelligence", "B2B SaaS"],
        "foundingDate": "2023",
        "address": {
            "@type": "PostalAddress",
            "addressLocality": "Bengaluru",
            "addressCountry": "India"
        },
        "numberOfEmployees": {
            "@type": "QuantitativeValue",
            "name": "11-50 employees"
        }
    }
    </script>
</head>
<body>
    <!-- Public header with sign in prompt -->
    <header class="nav">
        <a href="https://www.linkedin.com/login" class="nav__button-secondary">Sign in to LinkedIn</a>
        <a href="https://www.linkedin.com/signup" class="nav__button-primary">Join LinkedIn</a>
    </header>

    <main>
        <h1>Mysa</h1>
        <h2>Financial Services &bull; Bengaluru, India</h2>
        <p>AI-powered accounts payable and finance automation platform for modern businesses.</p>
    </main>

    <!-- Sign in modal that appears on public pages -->
    <div id="sign-in-modal" class="modal">
        <div class="modal__content">
            <h3>Sign in to LinkedIn</h3>
            <p>Join LinkedIn to view all employee profiles and full insights.</p>
            <button>Agree & Join</button>
        </div>
    </div>
</body>
</html>
